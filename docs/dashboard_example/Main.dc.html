<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TACE Admin Dashboard</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  * { box-sizing: border-box; }
</style>
</helmet>

<div style="width: 100%; min-height: 900px; background: #F4F6F8; display: flex; flex-wrap: wrap;">

  <!-- Sidebar -->
  <nav style="width: 260px; flex: 0 0 260px; background: #1A1A2E; min-height: 900px; display: flex; flex-direction: column; padding: 28px 16px;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 28px 12px;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #29ABE2; display: flex; align-items: center; justify-content: center; flex: 0 0 36px;">
        <span style="font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: #FFFFFF;">T</span>
      </div>
      <div style="display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; color: #FFFFFF;">TACE</span>
        <span style="font-size: 11px; color: #8A8DA6;">Admin</span>
      </div>
    </div>

    <sc-for list="{{navItems}}" as="item" hint-placeholder-count="11">
      <a href="#" onClick="{{item.select}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; margin-bottom: 2px; background: {{item.bg}}; color: {{item.color}}; font-size: 14px; font-weight: 500;">
        <span style="width: 20px; height: 20px; flex: 0 0 20px; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
        </span>
        {{item.label}}
      </a>
    </sc-for>

    <div style="margin-top: auto; padding: 14px 12px; border-top: 1px solid #2E2E48; display: flex; align-items: center; gap: 10px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #29ABE2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; flex: 0 0 32px;">OS</div>
      <div style="display: flex; flex-direction: column; line-height: 1.2; min-width: 0;">
        <span style="font-size: 13px; color: #FFFFFF; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Osime Simon</span>
        <span style="font-size: 11px; color: #8A8DA6;">Chairman</span>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main style="flex: 999 1 720px; min-width: 0; padding: 28px 36px 48px 36px;">

    <!-- Header -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px;">
      <div>
        <div style="font-size: 13px; color: #6B7280; margin-bottom: 4px;">Admin / Home</div>
        <h1 style="font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 26px; color: #1A1A2E; margin: 0;">Welcome back, Osime</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button aria-label="Notifications" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #E3E7EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
      </div>
    </div>

    <!-- Stat cards -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
        <div style="background: #FFFFFF; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #ECEFF3;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 13px; color: #6B7280; font-weight: 500;">{{s.label}}</span>
            <span style="width: 34px; height: 34px; border-radius: 9px; background: {{s.iconBg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 34px;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{s.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
            </span>
          </div>
          <span style="font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 28px; color: #1A1A2E;">{{s.value}}</span>
        </div>
      </sc-for>
    </div>

    <!-- Two column: activity + quick actions -->
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">

      <div style="flex: 2 1 420px; min-width: 0; background: #FFFFFF; border-radius: 14px; border: 1px solid #ECEFF3; padding: 22px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <h2 style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 16px; color: #1A1A2E; margin: 0;">Recent Activity</h2>
          <a href="#" style="font-size: 13px; color: #29ABE2; font-weight: 500;">View all</a>
        </div>

        <sc-if value="{{hasActivity}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column;">
            <sc-for list="{{activity}}" as="a" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F3F6;">
                <span style="width: 32px; height: 32px; border-radius: 8px; background: {{a.dotBg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 32px;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{a.dotColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg>
                </span>
                <div style="display: flex; flex-direction: column; min-width: 0;">
                  <span style="font-size: 13.5px; color: #1A1A2E; font-weight: 500;">{{a.text}}</span>
                  <span style="font-size: 12px; color: #8A8DA6;">{{a.time}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{hasNoActivity}}" hint-placeholder-val="{{false}}">
          <div style="padding: 32px 0; text-align: center;">
            <p style="font-size: 13.5px; color: #8A8DA6; margin: 0;">No activity yet. New applications, registrations and donations will show up here.</p>
          </div>
        </sc-if>
      </div>

      <div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{quickActions}}" as="qa" hint-placeholder-count="3">
          <a href="#" style="background: {{qa.bg}}; border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 12px;">
            <span style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex: 0 0 38px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{qa.icon}}"></path></svg>
            </span>
            <span style="font-size: 14px; font-weight: 600; color: #FFFFFF;">{{qa.label}}</span>
          </a>
        </sc-for>
      </div>

    </div>

  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { activeId: "home" };
  }

  select(id) {
    this.setState({ activeId: id });
  }

  renderVals() {
    const navDefs = [
      { id: "home", label: "Home", icon: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10" },
      { id: "applications", label: "Applications", icon: "M9 12h6 M9 16h6 M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6" },
      { id: "beneficiaries", label: "Beneficiaries", icon: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75" },
      { id: "members", label: "Members", icon: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.87" },
      { id: "sponsors", label: "Sponsors", icon: "M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" },
      { id: "mentors", label: "Mentors", icon: "M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" },
      { id: "finance", label: "Finance & Donations", icon: "M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" },
      { id: "projects", label: "Projects", icon: "M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" },
      { id: "content", label: "Content", icon: "M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" },
      { id: "reports", label: "Reports", icon: "M3 3v18h18 M18.7 8l-5.3 5.3-3-3L7 13.7" },
      { id: "settings", label: "Settings", icon: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" }
    ];

    const navItems = navDefs.map((n) => {
      const active = n.id === this.state.activeId;
      return {
        ...n,
        current: active ? "page" : undefined,
        bg: active ? "#29ABE2" : "transparent",
        color: active ? "#FFFFFF" : "#C7C9DA",
        select: () => this.select(n.id)
      };
    });

    const stats = [
      { label: "Total Beneficiaries", value: "0", icon: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", iconBg: "#E8F6FD", iconColor: "#29ABE2" },
      { label: "Active Sponsors", value: "0", icon: "M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z", iconBg: "#FDECEC", iconColor: "#ED1C24" },
      { label: "Pending Applications", value: "0", icon: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 15l2 2 4-4", iconBg: "#FEF6E2", iconColor: "#F7C100" },
      { label: "Total Donated", value: "\u20a60", icon: "M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6", iconBg: "#EAF8EF", iconColor: "#27AE60" },
      { label: "Active Mentors", value: "0", icon: "M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z", iconBg: "#E8F6FD", iconColor: "#29ABE2" },
      { label: "Active Members", value: "0", icon: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.87", iconBg: "#F1EFFB", iconColor: "#6B7280" }
    ];

    const activity = [];

    const quickActions = [
      { label: "Review Applications", icon: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 15l2 2 4-4", bg: "#29ABE2" },
      { label: "Add Announcement", icon: "M3 11l19-9-9 19-2-8-8-2z", bg: "#1A1A2E" },
      { label: "View Reports", icon: "M3 3v18h18 M18.7 8l-5.3 5.3-3-3L7 13.7", bg: "#27AE60" }
    ];

    return {
      navItems,
      stats,
      activity,
      hasActivity: activity.length > 0,
      hasNoActivity: activity.length === 0,
      quickActions
    };
  }
}
</script>
</body>
</html>
